name: Build debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Generar el Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x gradlew

      - name: Ejecutar tests unitarios
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir resultados de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-tests
          path: app/build/test-results/testDebugUnitTest/*.xml

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: NextAIPtvPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
